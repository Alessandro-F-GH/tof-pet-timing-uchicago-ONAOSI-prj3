name: Artifact store validation

on:
  push:
    branches:
      - codex/artifact-store-refactor
  pull_request:
    branches:
      - main

jobs:
  artifact-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Compile Python sources
        run: python -m compileall -q waveform_analysis
      - name: Test immutable artifact store
        env:
          PYTHONPATH: .
        run: python -m pytest -q waveform_analysis/tests/test_artifact_store.py
